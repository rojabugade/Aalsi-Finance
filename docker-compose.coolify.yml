# Coolify compose: no host ports, no dev bind mounts. In Coolify, leave the
# top-level Domains field empty and set a domain only on the `web` service.

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  # Single source of truth for OAuth callbacks, post-auth redirects, and CORS.
  # Set APP_ORIGIN in Coolify to your public web URL, e.g. https://your-domain.
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  CORS_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
  # Coolify terminates TLS at its own proxy, so exactly one X-Forwarded-For hop is
  # trustworthy. Left at the code default of 0 the rate limiter keys every request
  # on the proxy's IP, and one abusive client throttles everybody.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  # Error tracking. Blank disables it; events are scrubbed of bodies/cookies/PII.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  # Rolling per-user AI spend caps in USD. 0 is uncapped — set both if signup is
  # open, or a single account can run up an unbounded bill on your API key.
  LLM_DAILY_COST_LIMIT_USD: ${LLM_DAILY_COST_LIMIT_USD:-0}
  LLM_MONTHLY_COST_LIMIT_USD: ${LLM_MONTHLY_COST_LIMIT_USD:-0}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@postgres:5432/${POSTGRES_DB:-finance}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Coolify}
  S3_BUCKET: ${S3_BUCKET:-documents}
  S3_REGION: ${S3_REGION:-us-east-1}
  STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY in Coolify}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
  # Account recovery depends on outbound mail: without SMTP there is no password
  # reset and no email verification, so a locked-out user stays locked out.
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in Coolify — password reset needs it}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in Coolify}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Alsi Finance}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
  VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
  EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
  # --- Integration credentials ---
  # OAuth callbacks are derived from APP_ORIGIN by the backend as
  # <APP_ORIGIN>/api/<provider>/oauth/callback (routed via the web /api proxy).
  # Register that exact URL as the Callback URL in each provider's app.
  SPLITWISE_CONSUMER_KEY: ${SPLITWISE_CONSUMER_KEY:-}
  SPLITWISE_SECRET: ${SPLITWISE_SECRET:-}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
  PLAID_SECRET: ${PLAID_SECRET:-}
  PLAID_ENVIRONMENT: ${PLAID_ENVIRONMENT:-sandbox}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Coolify}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    # /health/ready checks Postgres, Redis and object storage. /health is liveness
    # only and would report healthy through a total database outage.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.celery_app.celery beat --loglevel=info
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.coolify
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api

  # Nightly dump of the database and the document objects. Both volumes below live
  # on this host, so `backups` must be pointed at off-host storage (or snapshotted
  # by Coolify) for this to survive the failure it exists for.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Coolify}
      S3_BUCKET: ${S3_BUCKET:-documents}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache minio-client >/dev/null 2>&1 || true
        while true; do
          /usr/local/bin/backup.sh || echo "[backup] FAILED"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  backups:
